<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Dream Wedding - Love Story Slideshow</title>
    <!-- Tailwind CSS CDN for high-end styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            background-color: #ebd3c8; /* Warm ivory baseline to completely eliminate black flashes/edges */
            transition: background-color 1200ms ease-in-out;
        }
        .font-serif {
            font-family: 'Playfair Display', serif;
        }
        .font-cursive {
            font-family: 'Alex Brush', cursive;
        }
        /* Custom slide backgrounds matching image_49a9a2.png blush-rose tones */
        .bg-candlelight {
            background: radial-gradient(circle, #fffbf9 0%, #f7e6de 60%, #ebd3c8 100%);
        }
        .bg-white-glow {
            background: radial-gradient(circle, #ffffff 0%, #fcf6f3 70%, #f3ded5 100%);
        }
        
        /* Ultra-sharp image rendering optimization */
        img {
            image-rendering: -webkit-optimize-contrast; /* Crisp rendering on Webkit/Safari */
            image-rendering: crisp-edges;
            backface-visibility: hidden;
            transform: translateZ(0); /* Force GPU acceleration for crisp zoom */
        }

        /* Enhanced luxury zoom animation for a more visible romantic motion */
        .zoom-in-active {
            animation: softZoom 7.5s ease-out forwards;
        }
        @keyframes softZoom {
            from { transform: scale(1.0); }
            to { transform: scale(1.06); } /* Increased slightly to 1.06 for more prominent motion without losing clarity */
        }
        /* Golden romantic border shadow for photo frames */
        .gold-shadow {
            box-shadow: 0 25px 55px rgba(110, 38, 44, 0.15), 0 1px 4px rgba(0, 0, 0, 0.05);
        }
        /* Hide mouse cursor after idle */
        .cursor-none {
            cursor: none;
        }
        /* Floating hearts and butterflies styling */
        .floating-heart {
            position: absolute;
            pointer-events: none;
            opacity: 0;
            animation: floatUp 9s ease-in-out infinite;
        }
        @keyframes floatUp {
            0% {
                transform: translateY(110vh) translateX(0) scale(0.4) rotate(0deg);
                opacity: 0;
            }
            15% {
                opacity: 0.3;
            }
            85% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-10vh) translateX(120px) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }
        /* Beautiful cursive glow to replicate the text styling */
        .cursive-glow {
            text-shadow: 0 4px 14px rgba(110, 38, 44, 0.18);
        }
    </style>
</head>
<body class="w-screen h-screen flex items-center justify-center relative select-none bg-[#0c0806]">

    <!-- RESPONSIVE SVG MASK FOR EXQUISITE HEART CLIPPING -->
    <svg width="0" height="0" class="absolute">
        <defs>
            <clipPath id="heart-clip" clipPathUnits="objectBoundingBox">
                <path d="M 0.5 0.24 C 0.44 0.07, 0.24 0.03, 0.11 0.16 C -0.03 0.31, -0.02 0.57, 0.15 0.73 L 0.5 1.0 L 0.85 0.73 C 1.02 0.57, 1.03 0.31, 0.89 0.16 C 0.76 0.03, 0.56 0.07, 0.5 0.24 Z" />
            </clipPath>
        </defs>
    </svg>

    <!-- FLOATING HEARTS & BUTTERFLIES BACKGROUND EFFECT -->
    <div id="hearts-bg" class="absolute inset-0 pointer-events-none overflow-hidden z-0"></div>

    <!-- MASTER CONTAINER (Stretches dynamically to 100% of display with zero black borders/edges) -->
    <div id="slideshow-canvas" class="relative z-10 w-full h-full overflow-hidden transition-all duration-[1200ms] ease-in-out bg-candlelight shadow-2xl">
        
        <!-- ACTIVE SLIDE RENDER AREA -->
        <div id="slide-content" class="absolute inset-0 z-10 flex items-center justify-center p-6 md:p-10 lg:p-12 transition-opacity duration-700 ease-in-out">
            <!-- Content gets injected dynamically by JavaScript -->
        </div>

        <!-- ROMANTIC HEART TRANSITION OVERLAY (The Heart-Wipe mechanism) -->
        <div id="heart-overlay" class="pointer-events-none absolute inset-0 z-50 flex items-center justify-center opacity-0 transition-all duration-[600ms] ease-in-out">
            <!-- A massive SVG heart scaling from center to cover the entire projector grid -->
            <svg id="transition-heart" viewBox="0 0 512 512" class="w-64 h-64 text-[#e0b094] fill-current transform scale-0 transition-transform duration-[600ms] ease-in-out" style="filter: drop-shadow(0 0 50px rgba(110, 38, 44, 0.8));">
                <path d="M462.3 62.6C407.5 15.9 326 24.3 275.7 76.2L256 96.5l-19.7-20.3C186 24.3 104.5 15.9 49.7 62.6c-62.8 53.6-66.1 149.8-9.9 207.9l193.5 199.8c12.5 12.9 32.8 12.9 45.3 0l193.5-199.8c56.3-58.1 53-154.3-9.8-207.9z"/>
            </svg>
        </div>

        <!-- CONTROL PANEL (Subtle overlay, fades away on idle) -->
        <div id="control-bar" class="absolute bottom-6 left-1/2 -translate-x-1/2 z-40 flex items-center gap-4 px-6 py-3 rounded-full bg-black/40 backdrop-blur-md border border-white/10 opacity-100 transition-opacity duration-500 hover:opacity-100">
            <!-- Fullscreen Button -->
            <button onclick="toggleFullScreen()" class="text-white/80 hover:text-white transition-colors" title="Bật/Tắt Toàn Màn Hình">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75v4.5m0-4.5h-4.5m4.5 0L15 9m5.25 11.25v-4.5m0 4.5h-4.5m4.5 0L15 15" />
                </svg>
            </button>
            <div class="h-4 w-px bg-white/20"></div>
            <!-- Prev Slide -->
            <button onclick="prevSlide()" class="text-white/80 hover:text-white transition-colors" title="Trang trước">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
                </svg>
            </button>
            <!-- Play/Pause -->
            <button id="play-pause-btn" onclick="togglePlay()" class="text-white/80 hover:text-white transition-colors" title="Tạm dừng / Tiếp tục">
                <svg id="pause-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25v13.5m-7.5-13.5v13.5" />
                </svg>
                <svg id="play-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 hidden">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.348a1.125 1.125 0 010 1.971l-11.54 6.347a1.125 1.125 0 01-1.667-.985V5.653z" />
                </svg>
            </button>
            <!-- Next Slide -->
            <button onclick="nextSlide()" class="text-white/80 hover:text-white transition-colors" title="Trang sau">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
                </svg>
            </button>
            <div class="h-4 w-px bg-white/20"></div>
            <!-- Slide Counter Display -->
            <span id="slide-counter" class="text-white/80 text-xs font-mono select-none">01 / 11</span>
        </div>

    </div>

    <!-- MAIN PRESENTATION SCRIPT -->

                bgClass: "bg-candlelight",

            {

            {

            {

                subtitle: "Khoảnh Khắc Rạng Rỡ",
                quote: "Nụ cười rạng ngời của em chính là ánh ban mai sưởi ấm thế giới của anh mỗi ngày.",
                layout: "vertical",
                bgClass: "bg-white-glow",

            },
            {
                image: "tri_5021.jpg",
                title: "A Tender Bloom",
                subtitle: "Hương Sắc Hạnh Phúc",
                quote: "Những đóa hoa nở rộ trên tay em như lời chúc phúc ngọt ngào nhất cho tình yêu bền chặt.",
                layout: "vertical",
                bgClass: "bg-white-glow",
                accentColor: "#c5a059"
            },
            {
                image: "tri_5029.jpg",
                title: "The Promise of Love",
                subtitle: "Hôn Ước Trăm Năm",

            {

                quote: "Dù cuộc sống có đổi thay, cái tựa tay ấm áp này vẫn mãi là điểm tựa bình yên nhất.",
                layout: "vertical",
                bgClass: "bg-white-glow",

            },
            {
                image: "tri_4849.jpg", // Automatically fallback to use the gorgeous wide golden-set couple photo
                title: "With Deep Gratitude",
                subtitle: "Lời Cảm Ơn Chân Thành",
                date: "06 . 06 . 2026",
                quote: "Chúng con xin trân trọng cảm ơn gia đình, bạn bè và quý quan khách đã đến chung vui, chúc phúc.",

                accentColor: "#6e262c"
            }
        ];

        let currentIdx = 0;
        let isPlaying = true;
        let slideInterval = null;
        const autoAdvanceTime = 6500; // 6.5s auto advance for peaceful reading
        let lastInteractionTime = Date.now();
        let isTransitioning = false; // Flag to prevent multiple rapid clicks during active animation

        // Dynamic Heart Ribbon design for subpages (made slightly wider and clearer)
        function getHeartOrnament(accent) {
            return `
                <div class="flex items-center justify-center gap-5 my-2 opacity-95 w-full max-w-[320px]">
                    <div class="h-[1px] flex-1" style="background: linear-gradient(to right, transparent, ${accent});"></div>
                    <svg viewBox="0 0 100 45" class="w-14 h-7" style="fill: ${accent};">

                    </svg>
                    <div class="h-[1px] flex-1" style="background: linear-gradient(to left, transparent, ${accent});"></div>

        }

        // Beautiful butterfly & floral wreath outline (Scaled beautifully for larger cover hearts)
        function getWreathDecoration() {
            return `

                        <g transform="translate(10, 18) scale(0.35) rotate(-20)" fill="#6e262c">
                            <path d="M12 10.5c-.13-1.34-.6-2.55-1.4-3.5C9.7 5.9 8.2 5 6.5 5 3.5 5 1 7.5 1 10.5c0 3.2 2.5 6.4 6 8.5.5-1.5 1.5-2.5 3.5-3.5M12 10.5c.13-1.34.6-2.55 1.4-3.5 1-1.1 2.4-2 4.1-2 3 0 5.5 2.5 5.5 5.5 0 3.2-2.5 6.4-6 8.5-.5-1.5-1.5-2.5-3.5-3.5" opacity="0.8"/>
                        </g>
                        <!-- Butterfly Right-Center -->
                        <g transform="translate(82, 45) scale(0.38) rotate(15)" fill="#e6b89c">
                            <path d="M12 10.5c-.13-1.34-.6-2.55-1.4-3.5C9.7 5.9 8.2 5 6.5 5 3.5 5 1 7.5 1 10.5c0 3.2 2.5 6.4 6 8.5.5-1.5 1.5-2.5 3.5-3.5M12 10.5c.13-1.34.6-2.55 1.4-3.5 1-1.1 2.4-2 4.1-2 3 0 5.5 2.5 5.5 5.5 0 3.2-2.5 6.4-6 8.5-.5-1.5-1.5-2.5-3.5-3.5" />
                        </g>
                        <!-- Butterfly Bottom-Left -->
                        <g transform="translate(20, 80) scale(0.3) rotate(-45)" fill="#6e262c">
                            <path d="M12 10.5c-.13-1.34-.6-2.55-1.4-3.5C9.7 5.9 8.2 5 6.5 5 3.5 5 1 7.5 1 10.5c0 3.2 2.5 6.4 6 8.5.5-1.5 1.5-2.5 3.5-3.5M12 10.5c.13-1.34.6-2.55 1.4-3.5 1-1.1 2.4-2 4.1-2 3 0 5.5 2.5 5.5 5.5 0 3.2-2.5 6.4-6 8.5-.5-1.5-1.5-2.5-3.5-3.5" opacity="0.6"/>

        // Render layout dynamically (balanced text to photo ratio with frosted panel)
        function getSlideHTML(slide, index) {
            const isHorizontal = slide.layout === 'horizontal';
            const accent = slide.accentColor;
            const isFirstSlide = index === 0;
            
            // Conditional date rendering markup (with much larger typography)
            const dateHTML = slide.date ? `<div class="text-xl lg:text-2xl xl:text-3xl tracking-[0.5em] font-extrabold text-[#6e262c] uppercase mt-3 mb-4 font-mono select-none">${slide.date}</div>` : '';
            
            // COVER SLIDE SPECIAL REPLICATED STYLE FROM image_49a9a2.png (Enlarged Elements)
            if (isFirstSlide) {
                return `
                    <div class="relative w-full h-full flex flex-col justify-between items-center py-4">
                        <!-- Top header "SAVE THE DATE" -->

                                    <!-- Wreath SVG overlay with rose borders and butterflies -->
                                    ${getWreathDecoration()}
                                    
                                    <!-- Masked Photo Container -->
                                    <div class="w-full h-full overflow-hidden shadow-xl" style="clip-path: url(#heart-clip);">
                                        <div class="w-full h-full bg-white p-1">
                                            <div class="w-full h-full overflow-hidden" style="clip-path: url(#heart-clip);">

                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Right: Groom Name "Thanh Phương" splitted calligraphically (Enlarged to 3 columns) -->

                                <div class="font-cursive text-8xl lg:text-9xl xl:text-[9.5rem] text-[#6e262c] leading-[0.55] tracking-wide transform rotate-12 cursive-glow">Thanh</div>
                                <div class="font-cursive text-7xl lg:text-8xl xl:text-[8.5rem] text-[#c5a059] leading-[0.55] mt-6 transform -rotate-6 pr-12 cursive-glow">Phương</div>
                            </div>

                        </div>

                        <!-- Bottom Footer (Golden Ornament, Wedding Date, Quote) -->
                        <div class="flex flex-col items-center text-center mt-1">
                            ${getHeartOrnament(accent)}
                            ${dateHTML}

                        </div>
                    </div>
                `;
            }

            // SUBPAGES HIGH-END MATCHING LAYOUTS (Optimized with 4-8 Split for larger photos)
            if (isHorizontal) {
                return `
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 w-full h-full max-h-[92vh] items-center">

                            <div class="relative w-full h-full flex justify-center items-center">
                                <div class="relative w-[100%] rounded-3xl overflow-hidden gold-shadow border border-[#f5e9d9] bg-white p-2.5">
                                    <div class="w-full h-full rounded-2xl overflow-hidden relative aspect-[4/3]">
                                        <img src="${slide.image}" alt="${slide.title}" class="w-full h-full object-cover zoom-in-active" onerror="handleImageError(this, '${slide.image}', '${slide.title}')">

            } else {
                return `
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 w-full h-full max-h-[92vh] items-center">
                        <!-- Left Column: Frosted Editorial Text Panel (col-span-4) -->
                        <div class="lg:col-span-4 flex flex-col justify-center items-center lg:items-start text-center lg:text-left space-y-6 px-8 py-10 bg-white/45 backdrop-blur-[6px] border border-white/60 rounded-3xl gold-shadow">
                            <span class="font-cursive text-5xl lg:text-6xl xl:text-7xl text-[#6e262c]" style="color: ${accent};">${slide.subtitle}</span>
                            <h2 class="font-serif text-3xl lg:text-4xl xl:text-5xl font-semibold tracking-wide text-[#6e262c] leading-tight">${slide.title}</h2>
                            ${getHeartOrnament(accent)}
                            ${dateHTML}
                            <p class="text-base lg:text-lg xl:text-xl italic text-gray-700 font-light leading-relaxed max-w-md">"${slide.quote}"</p>
                        </div>
                        <!-- Right Column: Balanced vertical frame - Enlarged to col-span-8 and 860px height -->
                        <div class="lg:col-span-8 flex justify-center items-center h-full max-h-[600px] lg:max-h-[780px] xl:max-h-[860px]">
                            <!-- Auto-scaling vertical frame that strictly honors original portrait aspect ratio -->
                            <div class="relative max-h-[580px] lg:max-h-[760px] xl:max-h-[840px] rounded-3xl overflow-hidden gold-shadow border border-[#f5e9d9] bg-white p-2.5 flex justify-center items-center">
                                <div class="h-full rounded-2xl overflow-hidden relative">
                                    <img src="${slide.image}" alt="${slide.title}" class="max-h-[560px] lg:max-h-[740px] xl:max-h-[820px] w-auto object-contain rounded-xl zoom-in-active" onerror="handleImageError(this, '${slide.image}', '${slide.title}')">
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        // Handle image loading errors with sequential extension attempts (resolves case-sensitivity issues on GitHub Pages)
        function handleImageError(imgElement, originalSrc, title) {
            if (!imgElement.dataset.errorCount) {
                imgElement.dataset.errorCount = 1;
            } else {
                imgElement.dataset.errorCount = parseInt(imgElement.dataset.errorCount) + 1;
            }
            
            const count = parseInt(imgElement.dataset.errorCount);
            const dotIndex = originalSrc.lastIndexOf('.');
            if (dotIndex === -1) {
                showBeautifulFallback(imgElement, title, originalSrc);
                return;
            }
            
            const baseName = originalSrc.substring(0, dotIndex);
            
            // Attempt different formats/cases sequentially (crucial for GitHub Pages / Linux servers)
            if (count === 1) {
                imgElement.src = baseName + ".JPG";
            } else if (count === 2) {
                imgElement.src = baseName + ".png";
            } else if (count === 3) {
                imgElement.src = baseName + ".PNG";
            } else if (count === 4) {
                imgElement.src = baseName + ".jpeg";
            } else if (count === 5) {
                imgElement.src = baseName + ".JPEG";
            } else {
                // If all attempts fail, render a gorgeous theme-matching placeholder card
                showBeautifulFallback(imgElement, title, originalSrc);
            }
        }

        // A beautiful, highly aesthetic fallback card that gracefully acts as a slide illustration
        function showBeautifulFallback(imgElement, title, originalSrc) {
            const parent = imgElement.closest('.relative');
            if (!parent) return;
            
            parent.innerHTML = `
                <div class="w-full h-full min-h-[350px] bg-gradient-to-br from-[#fffdfa] to-[#fcf1eb] flex flex-col items-center justify-center text-[#6e262c] p-8 text-center rounded-2xl relative overflow-hidden border border-white/50 shadow-inner">
                    <!-- Aesthetic Background Elements -->
                    <div class="absolute -top-12 -left-12 w-36 h-36 rounded-full bg-[#e0b094]/10 pointer-events-none"></div>
                    <div class="absolute -bottom-16 -right-16 w-52 h-52 rounded-full bg-[#6e262c]/5 pointer-events-none"></div>
                    
                    <!-- Interlocking Ring Art Symbolizing Everlasting Love -->
                    <svg viewBox="0 0 100 100" class="w-24 h-24 text-[#c5a059] fill-none stroke-current stroke-[1.5] mb-4" style="filter: drop-shadow(0 4px 6px rgba(110,38,44,0.1));">
                        <circle cx="43" cy="50" r="16" stroke="#c5a059" />
                        <circle cx="57" cy="50" r="16" stroke="#6e262c" stroke-opacity="0.8" />
                        <path d="M 50,38 C 50,38 48,34 44,34 C 40,34 38,38 41,41 L 50,50 L 59,41 C 62,38 60,34 56,34 C 52,34 50,38 50,38 Z" fill="#6e262c" opacity="0.15" stroke="none" />
                    </svg>
                    
                    <h3 class="font-serif text-2xl lg:text-3xl font-semibold tracking-wide text-gray-800 mb-1">${title}</h3>
                    <p class="font-cursive text-3.5xl text-[#c5a059] mb-4 cursive-glow">Thanh Tâm & Thanh Phương</p>
                    <div class="h-[1px] w-24 bg-[#6e262c]/10 mb-4"></div>
                    
                    <p class="text-xs text-gray-400 font-light max-w-md leading-relaxed">
                        <strong class="text-gray-600 font-medium">Lưu ý nhỏ cho ban kỹ thuật:</strong> Nếu bạn có tệp ảnh cưới thứ 11, hãy đặt tên tệp chính xác là <code class="bg-white/80 text-red-600 px-1.5 py-0.5 rounded font-mono font-semibold select-all">${originalSrc}</code> (hoặc viết hoa .JPG, .PNG) rồi đặt vào cùng một thư mục chạy slide để hiển thị ảnh tuyệt đẹp này nhé!
                    </p>
                </div>
            `;
        }

        // Heart-Wipe custom 3D scale transition (Perfected & Synchronized)
        function transitionToSlide(nextIdx) {
            if (isTransitioning) return; // Ignore click events when transitions are active
            isTransitioning = true;

            const overlay = document.getElementById('heart-overlay');
            const heart = document.getElementById('transition-heart');
            const canvas = document.getElementById('slideshow-canvas');
            const contentArea = document.getElementById('slide-content');
            
            // Enable pointer events during transition to block layout clicking
            overlay.style.pointerEvents = 'auto';
            
            // Phase 1: Heart expands dynamically to cover viewport fully (scale 35)
            heart.style.transform = 'scale(35)';
            overlay.style.opacity = '1';
            
            // Phase 2: Swap content at exactly 600ms (the absolute peak of overlay scale coverage)
            setTimeout(() => {
                currentIdx = nextIdx;
                const currentSlide = slides[currentIdx];
                
                // Swap slide backgrounds gracefully - No black edges!
                canvas.className = `relative z-10 w-full h-full overflow-hidden transition-all duration-[1200ms] ease-in-out ${currentSlide.bgClass}`;
                
                // Dynamically sync document body background to completely avoid letterboxing border colors
                if (currentSlide.bgClass === 'bg-candlelight') {
                    document.body.style.backgroundColor = '#ebd3c8';
                } else {
                    document.body.style.backgroundColor = '#f3ded5';
                }
                
                // Swap layout structure
                contentArea.innerHTML = getSlideHTML(currentSlide, currentIdx);
                
                // Update counter numbers
                document.getElementById('slide-counter').textContent = `${String(currentIdx + 1).padStart(2, '0')} / 11`;

                // Phase 3: Give 50ms for slide to fully render, then shrink heart scale back down
                setTimeout(() => {
                    heart.style.transform = 'scale(0)';
                    overlay.style.opacity = '0';
                    overlay.style.pointerEvents = 'none';
                    isTransitioning = false;
                }, 50);
                
            }, 600); // Matches the 600ms transition duration in style declarations perfectly
        }

        // Navigation functions
        function nextSlide() {
            if (isTransitioning) return;
            let next = currentIdx + 1;
            if (next >= slides.length) next = 0;
            transitionToSlide(next);
            resetTimer();
        }

        // Prev slide trigger
        function prevSlide() {
            if (isTransitioning) return;
            let prev = currentIdx - 1;
            if (prev < 0) prev = slides.length - 1;
            transitionToSlide(prev);
            resetTimer();
        }

        // Automatic slides show control
        function startTimer() {
            clearInterval(slideInterval);
            if (isPlaying) {
                slideInterval = setInterval(nextSlide, autoAdvanceTime);
            }
        }

        // Automation reset
        function resetTimer() {
            if (isPlaying) {
                startTimer();
            }
        }

        // Play/Pause toggler
        function togglePlay() {
            isPlaying = !isPlaying;
            const pauseIcon = document.getElementById('pause-icon');
            const playIcon = document.getElementById('play-icon');
            
            if (isPlaying) {
                pauseIcon.classList.remove('hidden');
                playIcon.classList.add('hidden');
                startTimer();
            } else {
                pauseIcon.classList.add('hidden');
                playIcon.classList.remove('hidden');
                clearInterval(slideInterval);
            }
        }

        // Dynamic background particle engine (Includes both hearts and elegant butterflies)
        function initFloatingHearts() {
            const container = document.getElementById('hearts-bg');
            // Warm blush pinks, golds, and rosewoods matching image_49a9a2.png
            const colors = ['#f5d6ce', '#eed5c5', '#6e262c', '#c5a059'];
            
            setInterval(() => {
                const particle = document.createElement('div');
                particle.classList.add('floating-heart');
                
                const size = Math.random() * 24 + 10;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                particle.style.left = `${Math.random() * 100}vw`;
                particle.style.animationDuration = `${Math.random() * 7 + 7}s`; // Between 7s and 14s
                
                const color = colors[Math.floor(Math.random() * colors.length)];
                const isButterfly = Math.random() > 0.4; // 60% Butterflies, 40% Hearts
                
                if (isButterfly) {
                    // SVG vector path for a beautiful butterfly particle
                    particle.innerHTML = `
                        <svg viewBox="0 0 24 24" fill="${color}">
                            <path d="M12 10.5c-.13-1.34-.6-2.55-1.4-3.5C9.7 5.9 8.2 5 6.5 5 3.5 5 1 7.5 1 10.5c0 3.2 2.5 6.4 6 8.5.5-1.5 1.5-2.5 3.5-3.5M12 10.5c.13-1.34.6-2.55 1.4-3.5 1-1.1 2.4-2 4.1-2 3 0 5.5 2.5 5.5 5.5 0 3.2-2.5 6.4-6 8.5-.5-1.5-1.5-2.5-3.5-3.5" />
                        </svg>
                    `;
                } else {
                    // SVG vector path for a traditional heart particle
                    particle.innerHTML = `
                        <svg viewBox="0 0 512 512" fill="${color}">
                            <path d="M462.3 62.6C407.5 15.9 326 24.3 275.7 76.2L256 96.5l-19.7-20.3C186 24.3 104.5 15.9 49.7 62.6c-62.8 53.6-66.1 149.8-9.9 207.9l193.5 199.8c12.5 12.9 32.8 12.9 45.3 0l193.5-199.8c56.3-58.1 53-154.3-9.8-207.9z"/>
                        </svg>
                    `;
                }
                
                container.appendChild(particle);
                
                // Auto cleanup DOM elements
                setTimeout(() => {
                    particle.remove();
                }, 14000);
            }, 750);
        }

        // Full Screen Mode Toggler (highly requested for clean projector view)
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable full-screen mode: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // Cinema Mode controls
        function registerIdleHandler() {
            const controlBar = document.getElementById('control-bar');
            
            function onInteraction() {
                lastInteractionTime = Date.now();
                controlBar.style.opacity = '1';
                document.body.classList.remove('cursor-none');
            }

            document.addEventListener('mousemove', onInteraction);
            document.addEventListener('keydown', onInteraction);
            document.addEventListener('click', onInteraction);
            document.addEventListener('touchstart', onInteraction);

            setInterval(() => {
                if (Date.now() - lastInteractionTime > 3000) {
                    controlBar.style.opacity = '0';
                    document.body.classList.add('cursor-none');
                }
            }, 1000);
        }

        // Bootstrapping
        window.onload = function() {
            const currentSlide = slides[currentIdx];
            const canvas = document.getElementById('slideshow-canvas');
            
            // Initial render setting body background matching candlelight
            document.body.style.backgroundColor = '#ebd3c8';
            canvas.className = `relative z-10 w-full h-full overflow-hidden transition-all duration-[1200ms] ease-in-out ${currentSlide.bgClass}`;
            
            document.getElementById('slide-content').innerHTML = getSlideHTML(currentSlide, currentIdx);
            
            startTimer();
            registerIdleHandler();
            initFloatingHearts();
            
            // Support global keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space') {
                    e.preventDefault();
                    togglePlay();
                } else if (e.code === 'ArrowRight') {
                    nextSlide();
                } else if (e.code === 'ArrowLeft') {
                    prevSlide();
                }
            });
        }
    </script>
</body>
</html>
